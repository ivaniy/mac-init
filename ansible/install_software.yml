    ############################################################
    # 12) Ansible via Brew
    ############################################################
    - name: Install Ansible (HomeBrew)
      when: ansible_install
      block:
        - name: Check Ansible
          ansible.builtin.command: "{{ brew_bin_dir }}/ansible --version"
          register: ans_ver
          failed_when: false
          changed_when: false

        - name: Install latest Ansible via Homebrew
          when:
            - brew_ver.rc == 0
            - ans_ver.rc != 0
          community.general.homebrew:
            name: ansible
            state: present
            path: "{{ brew_bin_dir }}"
          environment:
            NONINTERACTIVE: "1"
            HOMEBREW_NO_AUTO_UPDATE: "1"
      tags: ansible_install

    ############################################################
    # 13) jq (official binary)
    ############################################################
    - name: Install jq (official binary)
      when: jq_install
      block:
        - name: Check jq version
          ansible.builtin.command: /usr/local/bin/jq --version
          register: jq_ver
          failed_when: false
          changed_when: false

        - name: Download jq {{ jq_version }}
          when: jq_ver.rc != 0 or (jq_ver.stdout | default('')) is not search(jq_version)
          ansible.builtin.get_url:
            url: "{{ jq_url }}"
            dest: "{{ installers_dir }}/jq"
            mode: "0644"

        - name: Install jq to /usr/local/bin
          when: jq_ver.rc != 0 or (jq_ver.stdout | default('')) is not search(jq_version)
          ansible.builtin.copy:
            src: "{{ installers_dir }}/jq"
            dest: /usr/local/bin/jq
            mode: "0755"
            remote_src: true
      tags: jq_install

    ############################################################
    # 14) Google Cloud CLI (official tarball)
    ############################################################
    - name: Install Google Cloud CLI (official tarball)
      when:
        - gcloud_cli_install
        - brew_ver.rc == 0
      block:
        - name: Check gcloud
          ansible.builtin.command: "{{gcloud_home}}/bin/gcloud --version"
          register: gcloud_ver
          failed_when: false
          changed_when: false

        ## Prerequisites: GNU tar (gtar)
        - name: Ensure gnu-tar (gtar) is installed (HomeBrew)
          when: gcloud_ver.rc != 0
          community.general.homebrew:
            name: gnu-tar
            state: present
            path: "{{ brew_bin_dir }}"
          environment:
            NONINTERACTIVE: "1"
            HOMEBREW_NO_AUTO_UPDATE: "1"

        - name: Download gcloud CLI (tar.gz)
          when: gcloud_ver.rc != 0
          ansible.builtin.get_url:
            url: "{{ gcloud_cli_url }}"
            dest: "{{ installers_dir }}/{{ gcloud_tgz }}"
            mode: "0644"

        - name: Extract gcloud CLI
          when: gcloud_ver.rc != 0
          ansible.builtin.unarchive:
            src: "{{ installers_dir }}/{{ gcloud_tgz }}" # "{{ gcloud_cli_url }}" # "{{ installers_dir }}/{{ gcloud_tgz }}"
            dest: "{{ user_home }}"
            remote_src: true
            creates: "{{ gcloud_home }}/install.sh"
          environment:
            PATH: "{{ brew_bin_dir }}:{{ ansible_env.PATH }}"

        - name: Silent install gcloud
          when: gcloud_ver.rc != 0
          ansible.builtin.shell: |
            CLOUDSDK_CORE_DISABLE_PROMPTS=1 "{{ gcloud_home }}/install.sh" --quiet --install-python false --path-update True
      tags: gcloud_cli_install

    # - name: Symlink gcloud into /usr/local/bin
