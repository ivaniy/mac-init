    ############################################################
    # 17) Kubectl CLI (official + checksum)
    ############################################################
    - name: Make kubectl version manager dir
      when: kubectl_version_manager
      ansible.builtin.file:
        path: "{{ user_home }}/.kubvm/"
        state: directory
        mode: "0755"
      tags: kubectl_version_manager

    - name: Install  Kubectl CLI (official)
      when: kubectl_install
      block:
        # Check current kubectl
        - name: Check existing kubectl version
          ansible.builtin.command: "/usr/local/bin/kubectl version --client -o json"
          register: kubectl_ver
          failed_when: false
          changed_when: false

        # Resolve version if "stable" is requested
        - name: Resolve latest stable kubectl version
          when: kubectl_version == "stable"
          ansible.builtin.uri:
            url: "https://dl.k8s.io/release/stable.txt"
            return_content: true
          register: kubectl_stable

        - name: Choose kubectl version
          ansible.builtin.set_fact:
            chosen_kubectl_version: "{{ kubectl_stable.content | trim if (kubectl_version == 'stable') else kubectl_version }}"

        - name: Decide if kubectl needs install/upgrade
          ansible.builtin.set_fact:
            kubectl_need_install: "{{ kubectl_ver.rc != 0 or ( (kubectl_ver.stdout | default('{}') | from_json).clientVersion.gitVersion != chosen_kubectl_version ) }}"
          when: kubectl_ver is defined

        - name: Build kubectl URLs (official)
          when: kubectl_need_install
          ansible.builtin.set_fact:
            kubectl_url: "https://dl.k8s.io/release/{{ chosen_kubectl_version }}/bin/darwin/{{ kubectl_arch }}/kubectl"
            kubectl_sha_url: "https://dl.k8s.io/release/{{ chosen_kubectl_version }}/bin/darwin/{{ kubectl_arch }}/kubectl.sha256"
            kubectl_bin: "kubectl-{{ chosen_kubectl_version }}-{{ kubectl_arch }}"

        # Fetch checksum and binary (verify with sha256)
        - name: Fetch kubectl sha256
          when: kubectl_need_install
          ansible.builtin.uri:
            url: "{{ kubectl_sha_url }}"
            return_content: true
          register: kubectl_sha

        - name: Download kubectl (official, verified)
          when: kubectl_need_install
          ansible.builtin.get_url:
            url: "{{ kubectl_url }}"
            dest: "{{ installers_dir }}/{{ kubectl_bin }}"
            mode: "0755"
            checksum: "sha256:{{ kubectl_sha.content | trim }}"

        - name: Make kubectl {{ chosen_kubectl_version }} version dir
          when:
            - kubectl_need_install
            - kubectl_version_manager
          ansible.builtin.file:
            path: "{{ user_home }}/.kubvm/{{ chosen_kubectl_version }}"
            state: directory
            mode: "0755"

        - name: Copy kubectl to version dir
          when:
            - kubectl_need_install
            - kubectl_version_manager
          ansible.builtin.copy:
            src: "{{ installers_dir }}/{{ kubectl_bin }}"
            dest: "{{ user_home }}/.kubvm/{{ chosen_kubectl_version }}/kubectl"
            mode: "0755"
            remote_src: true

        - name: Copy kubectl to /usr/local/bin/
          when:
            - kubectl_need_install
            - not kubectl_version_manager
          ansible.builtin.copy:
            src: "{{ installers_dir }}/{{ kubectl_bin }}"
            dest: "/usr/local/bin/kubectl"
            mode: "0755"
            remote_src: true

        - name: Create link to kubectl {{ chosen_kubectl_version }} version dir
          when:
            - kubectl_need_install
            - kubectl_version_manager
          ansible.builtin.file:
            src: "{{ user_home }}/.kubvm/{{ chosen_kubectl_version }}/kubectl"
            dest: "/usr/local/bin/kubectl"
            state: link
      tags: kubectl_install

    - name: Install kubectl version manager function (kubvm)
      when: kubectl_version_manager
      ansible.builtin.copy:
        dest: "{{ user_home }}/.kubvm/kubvm.sh"
        mode: "0644"
        content: |
          {{ lookup('file', 'files/kubvm.sh') }}
      tags: kubectl_version_manager

    - name: Source kubvm from .bashrc
      when: kubectl_version_manager
      ansible.builtin.lineinfile:
        path: "{{ dest_shell_rc_file }}"
        create: true
        line: '[[ -r "${HOME}/.kubvm/kubvm.sh" ]] && source "${HOME}/.kubvm/kubvm.sh"'
        state: present
      tags: kubectl_version_manager

    ############################################################
    # 99) Cleanup installers
    ############################################################
    - name: Cleanup installers
      when: cleanup_installers
      ansible.builtin.file:
        path: "{{ installers_dir }}"
        state: absent
      tags: cleanup_installers
