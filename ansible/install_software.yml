    ############################################################
    # 16) Auth0 CLI (HomeBrew)
    ############################################################
    - name: Install Auth0 CLI (HomeBrew)
      when:
        - auth0_cli_install
        - brew_ver.rc == 0
      block:
        - name: Check auth0
          ansible.builtin.command: "{{ brew_bin_dir }}/auth0 --version"
          register: auth0_ver
          failed_when: false
          changed_when: false

        # Auth0 CLI (official tap)
        - name: Ensure auth0/auth0-cli tap is present
          when: auth0_ver.rc != 0
          community.general.homebrew_tap:
            name: auth0/auth0-cli
            state: present
            path: "{{ brew_bin_dir }}"
          environment:
            NONINTERACTIVE: "1"
            HOMEBREW_NO_AUTO_UPDATE: "1"

        - name: Install Auth0 CLI
          when: auth0_ver.rc != 0
          community.general.homebrew:
            name: auth0
            state: present
